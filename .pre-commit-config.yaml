# Instalar una vez:  uvx pre-commit install
# Ejecutar todo:     uvx pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
        exclude: ^(backend/openapi\.json|frontend/src/shared/api/schema\.d\.ts)$
      - id: check-yaml
        stages: [pre-commit, manual]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-backend
        name: ruff (backend)
        entry: uv run --directory backend ruff check --fix .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-format-backend
        name: ruff format (backend)
        entry: uv run --directory backend ruff format .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-sap-mock
        name: ruff (sap-mock)
        entry: uv run --directory tools/sap-mock ruff check --fix .
        language: system
        files: ^tools/sap-mock/.*\.py$
        pass_filenames: false
      - id: prettier-frontend
        name: prettier (frontend)
        entry: pnpm -C frontend format
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: eslint-frontend
        name: eslint (frontend)
        entry: pnpm -C frontend lint
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
